<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CallGate 设备事件</title>
<body><h1>设备事件收件箱</h1><p>仅记录求助 / 核验意图；尚未发起联系人核验，不能批准付款。显示最近 100 条。</p>
<label>只读页面凭证 <input id="token" type="password" autocomplete="off"></label><button id="start">连接 / 刷新</button><button id="stop">断开</button><p id="status" role="status">未连接</p><pre id="events"></pre>
<script>
let timer, credential = '';
const token = document.getElementById('token'), status = document.getElementById('status');
async function refresh() {
 try {
 const r = await fetch('/api/device-events', {headers: {Authorization: 'Bearer ' + credential}, cache:'no-store'});
 if (!r.ok) throw new Error('HTTP ' + r.status);
 const data = await r.json(); document.getElementById('events').textContent = JSON.stringify(data.events, null, 2);
 status.textContent = '已连接：' + data.events.length + ' 条';
 } catch(e) { clearInterval(timer); status.textContent = '连接失败：' + e.message; }
}
document.getElementById('start').onclick = () => {clearInterval(timer); credential = token.value; token.value = ''; refresh(); timer = setInterval(refresh, 2000);};
document.getElementById('stop').onclick = () => {clearInterval(timer); credential = ''; token.value = ''; document.getElementById('events').textContent = ''; status.textContent = '已断开';};
</script></body></html>
